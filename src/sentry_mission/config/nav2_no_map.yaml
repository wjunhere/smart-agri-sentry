global_costmap:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link
    rolling_window: true
    width: 6
    height: 6
    resolution: 0.05
    plugins: ["obstacle_layer", "inflation_layer"]
    obstacle_layer:
      observation_sources: scan
      scan:
        topic: /scan
        data_type: "LaserScan"
        clearing: true
        marking: true
        obstacle_range: 2.0
        raytrace_range: 3.0
    inflation_layer:
      inflation_radius: 0.4

local_costmap:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link
    rolling_window: true
    width: 2
    height: 2
    resolution: 0.05
    plugins: ["obstacle_layer", "inflation_layer"]
    obstacle_layer:
      observation_sources: scan
      scan:
        topic: /scan
        data_type: "LaserScan"
        clearing: true
        marking: true
        obstacle_range: 2.0
        raytrace_range: 3.0
    inflation_layer:
      inflation_radius: 0.35