global_costmap:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link
    rolling_window: true
    width: 6
    height: 6
    resolution: 0.05
    plugins: ["obstacle_layer", "inflation_layer"]
    obstacle_layer:
      observation_sources: scan
      scan:
        topic: /scan
        data_type: "LaserScan"
        clearing: true
        marking: true
        obstacle_range: 2.0
        raytrace_range: 3.0
    inflation_layer:
      inflation_radius: 0.4

local_costmap:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link
    rolling_window: true
    width: 2
    height: 2
    resolution: 0.05
    plugins: ["obstacle_layer", "inflation_layer"]
    obstacle_layer:
      observation_sources: scan
      scan:
        topic: /scan
        data_type: "LaserScan"
        clearing: true
        marking: true
        obstacle_range: 2.0
        raytrace_range: 3.0
    inflation_layer:
      inflation_radius: 0.35

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.1
      use_astar: false

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    controller_plugins: ["FollowPath"]
    goal_checker_plugins: ["simple_goal_checker"]
    simple_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 3.1416
      stateful: true
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 1000
      v_std: 0.2
      angular_v_std: 0.4
      motion_model: "DiffDrive"
      temperature: 0.3
      gamma: 0.015
      path_potential_weight: 5.0
      path_follow_weight: 1.0
      goal_cost_weight: 10.0
      obstacle_weight: 6.0
      cost_at_goal_weight: 2.0
      max_velocity: 0.3
      max_angular_velocity: 0.8
      acceleration_limiter:
        max_acceleration: 0.5
        max_deceleration: 0.5
        max_angular_acceleration: 1.0
      search_radius: 1.0
      visualize: false

bt_navigator:
  ros__parameters:
    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"

recoveries_server:
  ros__parameters:
    recovery_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_recoveries/Spin"
    backup:
      plugin: "nav2_recoveries/BackUp"
    wait:
      plugin: "nav2_recoveries/Wait"

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower/WaitAtWaypoint"
      enabled: true
