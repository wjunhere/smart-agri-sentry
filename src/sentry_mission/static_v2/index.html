<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智农哨兵 · 仪表盘</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <top-bar></top-bar>
    <div class="main-layout">
      <div class="left-panel">
        <camera-panel></camera-panel>
        <control-panel></control-panel>
        <status-bar></status-bar>
      </div>
      <div class="right-panel">
        <detection-card></detection-card>
        <diagnosis-card></diagnosis-card>
        <advisory-card></advisory-card>
        <forecast-panel></forecast-panel>
          <div class="card" style="margin-bottom:8px">
            <div style="display:flex; gap:8px; align-items:center;">
              <span style="color:#64748B; font-size:12px;">农田位置</span>
              <input type="number" :value="store.weatherLat" step="0.01"
                     @change="e => store.weatherLat = parseFloat(e.target.value)"
                     style="width:80px; background:#1E293B; border:1px solid #334155; color:#F8FAFC; padding:4px 8px; border-radius:4px; font-size:12px;" placeholder="纬度">
              <input type="number" :value="store.weatherLon" step="0.01"
                     @change="e => store.weatherLon = parseFloat(e.target.value)"
                     style="width:80px; background:#1E293B; border:1px solid #334155; color:#F8FAFC; padding:4px 8px; border-radius:4px; font-size:12px;" placeholder="经度">
              <span style="color:#64748B; font-size:11px;">{{ store.weatherCity }}</span>
            </div>
          </div>
        <weather-panel></weather-panel>
      </div>
    </div>
    <env-data-bar></env-data-bar>
    <alert-detail-modal></alert-detail-modal>
    <waypoint-editor :visible="store.showWpEditor" @close="store.showWpEditor = false"></waypoint-editor>
  </div>

  <script src="ros.js"></script>
  <script src="components/top-bar.js"></script>
  <script src="components/camera-panel.js"></script>
  <script src="components/detection-card.js"></script>
  <script src="components/diagnosis-card.js"></script>
  <script src="components/diagnosis-toggle.js"></script>
  <script src="components/advisory-card.js"></script>
  <script src="components/forecast-panel.js"></script>
	  <script src="components/weather-panel.js"></script>
  <script src="components/alert-detail-modal.js"></script>
  <script src="components/env-data-bar.js"></script>
  <script src="components/dpad.js"></script>
  <script src="components/crop-selector.js"></script>
  <script src="components/cruise-panel.js"></script>
  <script src="components/waypoint-editor.js"></script>
  <script src="components/status-bar.js"></script>
  <script src="components/control-panel.js"></script>
  <script src="app.js"></script>
</body>
</html>
